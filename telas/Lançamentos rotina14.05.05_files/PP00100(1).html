                 <script>
                     document.all.opcaoRel.focus();
                     function ValidaParRel(){
                        if( !ValidaCampos() ){
                            return false;
                        }
                        if( !ValidaData( document.all.iniDat.value, "DD/MM/YYYY" ) ){
                            document.all.iniDat.select();
                            document.all.iniDat.focus();
                            return false;
                        }
                        if( !ValidaData( document.all.fimDat.value, "DD/MM/YYYY" ) ){
                            document.all.fimDat.select();
                            document.all.fimDat.focus();
                            return false;
                        }
                        dataI = document.all.iniDat.value;
                        dataF = document.all.fimDat.value;
                        diaI = dataI.substring(0,2);
                        mesI = dataI.substring(3,5);
                        anoI = dataI.substring(6,10);
                        diaF = dataF.substring(0,2);
                        mesF = dataF.substring(3,5);
                        anoF = dataF.substring(6,10);
                        dataInicial = anoI + mesI + diaI;
                        dataFinal = anoF + mesF + diaF;
                        if( dataInicial > dataFinal ){
                            alert('Data inicial maior que final');
                            document.all.iniDat.select();
                            document.all.iniDat.focus();
                            return false;
                        }
                        if( !ComparaValor( "iniCli", "fimCli", "Fornecedor" ) ){
                            return false;
                        }
                        if( !ComparaValor( "iniPor", "fimPor", "Portador" ) ){
                            return false;
                        }
                        if( !ComparaValor( "iniEsp", "fimEsp", "Espécie" ) ){
                            return false;
                        }
                        if( !ComparaValor( "iniVin", "fimVin", "Vinculo" ) ){
                            return false;
                        }
                        if( !ComparaValor( "iniNatDoc", "fimNatDoc", "Natureza Documento" ) ){
                            return false;
                        }
                        if( !ComparaValor( "iniRef", "fimRef", "Referência" ) ){
                            return false;
                        }
                        document.all.filaimpressao.value = 0;
                        return true;
                     }
                     function CarregaCampo(){
                         if( document.all.dataPreferencia.value == '' ){
                             document.all.nomeCodigo.innerHTML = " ";
                             document.all.iniDat.disabled = true;
                             document.all.iniDat.className = 'clsDisabled';
                             document.all.fimDat.disabled = true;
                             document.all.fimDat.className = 'clsDisabled';
                             return true;
                         }
                         else{
                             if( document.all.dataPreferencia.value == 'C' ){
                                 document.all.nomeCodigo.innerHTML = "Data Contábil ";
                                 document.all.iniDat.disabled = false;
                                 document.all.iniDat.className = 'campo';
                                 document.all.fimDat.disabled = false;
                                 document.all.fimDat.className = 'campo';
                                 return true;
                             }
                             else{
                                  if( document.all.dataPreferencia.value == 'M' ){
                                      document.all.nomeCodigo.innerHTML = "Data Movimento ";
                                      document.all.iniDat.disabled = false;
                                      document.all.iniDat.className = 'campo';
                                      document.all.fimDat.disabled = false;
                                      document.all.fimDat.className = 'campo';
                                      return true;
                                  }
                             }
                         }
                     }
