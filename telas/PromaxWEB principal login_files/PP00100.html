               function ValidaUsuario(){
                   if( document.all.ssoLogin == "Y" ){
                       return true;
                   }
                   if( document.all.ssoLogin == "F" ){
                       return true;
                   }
                   if( document.all.Usuario.value == '' ){

                   }

                   wNovaSenha.focus();

               function LoginSSO(){
                   if (document.all.forceSSO.checked){
                      document.all.ssoLogin.value = "F";
                   }else{
                      document.all.ssoLogin.value = "Y";
                   };
                   document.all.frmLogin.submit();
               }
