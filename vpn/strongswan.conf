# Override do strongswan.conf padrão — só ajusta o timing de retransmissão
# do charon (ver comentário em ipsec.conf sobre o ciclo de reinício rápido).
#
# Com os defaults (retransmit_tries=5, retransmit_timeout=4.0,
# retransmit_base=1.8), uma troca que não fecha (ex: fase XAuth com
# fragmentos se perdendo) desiste e reinicia a IKE_SA a cada ~12s — rápido
# demais quando o peer (FortiGate) está sob algum throttling/instabilidade,
# e só piora a situação martelando repetidamente. Com os valores abaixo,
# cada tentativa individual espera bem mais antes de desistir e reiniciar.
charon {
    load_modular = yes
    retransmit_tries = 3
    retransmit_timeout = 12.0
    retransmit_base = 1.8
    plugins {
        include strongswan.d/charon/*.conf
    }
}

include strongswan.d/*.conf
