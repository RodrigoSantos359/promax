# Conexão IPsec para a VPN corporativa (FortiGate 45.162.237.6), convertida
# 1:1 a partir do export do FortiClient 7.4.3 (conexão "Dibrasa",
# Backup_fortiClient/backup.conf) — ver análise completa na conversa/commit
# que introduziu este arquivo para o mapeamento campo-a-campo.
#
# {{RIGHTSUBNET}} é substituído em runtime pelo entrypoint.sh a partir de
# VPN_REMOTE_SUBNETS (.env) — permite trocar de full-tunnel (0.0.0.0/0, igual
# ao FortiClient) para split-tunnel (ex: 10.50.0.0/16) sem rebuild da imagem.

config setup
    charondebug="ike 2, knl 2, cfg 2"
    uniqueids=no

conn dibrasa
    keyexchange=ikev1
    aggressive=yes

    # --- Phase 1 (IKE) --- FortiClient: PSK, DH14, AES128/256-SHA256, lifetime 86400s
    authby=psk
    ike=aes128-sha256-modp2048,aes256-sha256-modp2048!
    ikelifetime=86400s

    # --- XAuth --- FortiClient: xauth enabled, usuário/senha solicitados no connect
    # (credenciais vêm de /etc/ipsec.secrets, gerado em runtime pelo entrypoint
    # a partir dos Docker secrets — nunca ficam neste arquivo nem no git)
    leftauth=psk
    leftauth2=xauth
    # Sem isto, o strongSwan busca a credencial XAuth em ipsec.secrets usando
    # leftid (%any -> nosso IP) como identidade, em vez do usuário real —
    # falha com "no XAuth password found for '<nosso-ip>' - '<gateway>'".
    xauth_identity={{XAUTH_IDENTITY}}
    rightauth=psk

    # --- Mode Config --- FortiClient: mode_config=1, use_vip=1 (recebe IP virtual
    # e, potencialmente, DNS do FortiGate)
    leftsourceip=%config4

    # --- Phase 2 (ESP) --- FortiClient: DH5 (PFS), AES128/256-SHA1, lifetime 43200s
    # PFS (grupo DH5) já vem embutido no 'esp=' acima (modp1536) — não precisa
    # de 'pfs=yes' separado (strongSwan avisa isso como deprecated).
    esp=aes128-sha1-modp1536,aes256-sha1-modp1536!
    lifetime=43200s

    # --- Endpoints ---
    left=%defaultroute
    leftid=%any
    right=45.162.237.6
    rightid=%any
    # Selector do túnel: FortiClient negocia 0.0.0.0/0 (full-tunnel) — ver
    # análise sobre por que normalmente é melhor manter isto e restringir o
    # tráfego localmente (ip route/policy), em vez de pedir um rightsubnet
    # mais estreito que o FortiGate pode rejeitar.
    rightsubnet={{RIGHTSUBNET}}

    # --- NAT-T --- FortiClient: nat_traversal=1, udp_port 500
    forceencaps=yes

    # --- DPD / reconexão automática --- FortiClient: dpd=1, 3 tentativas a cada 5s
    dpdaction=restart
    dpddelay=5s
    dpdtimeout=15s

    # auto=add (NÃO "start"): só carrega a config, sem o próprio strongSwan
    # tentando reconectar sozinho. Com "start" + aggressive mode, quando a
    # troca de fragmentos (fase XAuth) não fecha, o charon reinicia a
    # IKE_SA por conta própria a cada ~13s ("peer did not initiate expected
    # exchange, reestablishing IKE_SA") — um ciclo de retry PRÓPRIO dele,
    # que ignora completamente o backoff do monitor em entrypoint.sh.
    # Resultado observado: ~14 tentativas/3min martelando o FortiGate sem
    # parar, o suficiente pra prolongar/piorar um bloqueio anti-flood do
    # lado deles. Com "add", só o monitor (com backoff exponencial) decide
    # quando chamar 'ipsec up'.
    auto=add
    # Finito (não %forever): cada 'ipsec up' desiste rápido se o peer não
    # responder, em vez de ficar retransmitindo pacotes indefinidamente por
    # conta própria.
    keyingtries=3
